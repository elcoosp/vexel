privacyPractices:
  singlePurpose: >
    Enhances Google AI Mode with local file context injection (@), reusable
    slash prompt skills (/), direct code-block saving to local files, and
    conversation navigation tools.
  permissionJustifications:
    storage: >
      Stores user onboarding completion status and local workspace preferences
      strictly on the user device via chrome.storage.local.
    https://google.com*: >
      Injects the Vexel command palette, code-block save triggers, thread
      timeline rail, and CSS virtualization enhancements on Google AI Mode
      pages.
    http://127.0.0*: >
      Communicates exclusively with the user optional local @vexel/bridge CLI
      process on the loopback interface to read project files, git diffs, and
      write saved code blocks.
  collectsUserData: false
  privacyPolicyUrl: https://github.com/blob/main/PRIVACY.md
  certifications:
    noThirdPartyTransfers: true
    noUnrelatedUse: true
    noCreditworthinessUse: true
distribution:
  visibility: public
  regions: all
releaseNotes:
  0.2.2: >
    Release 0.2.2: / slash command palette with SKILL.md support, @ local file &
    folder packer (Zero-Server File System Access API + optional localhost
    bridge), 1-click Save to file on code blocks, large-paste auto-attachment,
    timeline rail, Markdown export, and content-visibility thread
    virtualization.
