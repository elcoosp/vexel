  version: 0.2.2
storeListing:
  category: Developer Tools
  defaultLocale: en
  supportUrl: https://github.com
  homepageUrl: https://github.com
  locales:
    en:
      title: Vexel
      summary: Command Palette locale (~/.agents/skills), anti-troncation et
        acceleration DOM.
      detailedDescription: >
        Vexel upgrades Google AI Mode into a fast, keyboard-first engineering
        workspace connected directly to your codebase — with zero cloud relays
        and zero telemetry.


        KEY FEATURES

        ────────────────────────────────────────


        1. SLASH COMMANDS & ENGINEERING SKILLS (/)

        • Type "/" in the Google AI Mode prompt box to trigger reusable
        engineering prompts and custom SKILL.md workflows (code review,
        architecture audit, test generation, refactoring).

        • Supports instant keyboard navigation and one-click installation from
        skills.sh.


        2. REPOSITORY CONTEXT (@) — ZERO-SERVER OR LOCAL BRIDGE

        • Type "@" to browse your project files or pack an entire directory into
        clean context without leaving Google AI Mode.

        • Zero-Server Mode: Uses Chrome native File System Access API directly
        on your device — no terminal or background process required.

        • Optional Bridge (@vexel/bridge): Connects over localhost (127.0.0.1)
        for instant git diff injection and workspace synchronization.


        3. ONE-CLICK "SAVE TO FILE" ON CODE BLOCKS

        • Hover any generated code block to reveal a "Save to file" trigger.

        • Automatically infers the target file path from language tags or header
        comments, offers folder autocomplete, and writes directly to disk.


        4. AUTO-CONVERT LONG PASTES TO CLEAN ATTACHMENTS

        • Pasting large logs, stack traces, or multi-file snippets automatically
        converts them into neat file attachments instead of overflowing the
        prompt box.


        5. HIGH-SPEED THREAD VIRTUALIZATION & TIMELINE RAIL

        • Keeps long, multi-turn Google AI Mode sessions responsive using native
        CSS content-visibility virtualization.

        • Includes a floating timeline rail, one-click Clean Thread Copy, and
        full Markdown export.


        PRIVACY BY DESIGN

        ────────────────────────────────────────

        ✓ Zero analytics, zero tracking, zero external servers.

        ✓ All preferences and directory handles stay strictly on your machine.

        ✓ Optional bridge communication is bound exclusively to 127.0.0.1 with
        token authentication.
    fr:
      title: Vexel — Workspace local pour Google AI Mode
      summary: "Transformez Google AI Mode en workspace local : commandes /, fichiers
        @, sauvegarde directe de code et virtualisation rapide."
      detailedDescription: >
        Vexel transforme Google AI Mode en un environnement d ingénierie rapide,
        pilotable au clavier et connecté directement à votre dépôt — sans
        serveur relais ni télémétrie.


        FONCTIONNALITÉS CLÉS

        ────────────────────────────────────────


        1. COMMANDES SLASH & SKILLS D INGÉNIERIE (/)

        • Tapez "/" dans la zone de saisie Google AI Mode pour déclencher des
        prompts réutilisables et des workflows SKILL.md (revue de code, audit d
        architecture, tests, refactoring).

        • Navigation clavier instantanée et installation en un clic depuis
        skills.sh.


        2. CONTEXTE DE DÉPÔT (@) — ZÉRO-SERVEUR OU BRIDGE LOCAL

        • Tapez "@" pour parcourir les fichiers de votre projet ou packer un
        dossier complet sans quitter Google AI Mode.

        • Mode Zéro-Serveur : Utilise l API native File System Access de Chrome
        directement sur votre machine — aucun terminal requis.

        • Bridge optionnel (@vexel/bridge) : Se connecte sur localhost
        (127.0.0.1) pour injecter vos git diff et synchroniser votre espace de
        travail.


        3. SAUVEGARDE DIRECTE "SAVE TO FILE" SUR LES BLOCS DE CODE

        • Survolez n importe quel bloc de code généré pour afficher le bouton
        "Save to file".

        • Détecte automatiquement le chemin cible depuis le langage ou les
        commentaires d en-tête, avec autocomplétion des dossiers.


        4. CONVERSION AUTOMATIQUE DES LONGS COLLAGES EN PIÈCES JOINTES

        • Coller de longs logs, stack traces ou extraits multi-fichiers les
        convertit automatiquement en pièces jointes propres.


        5. VIRTUALISATION HAUTE VITESSE & RAIL DE NAVIGATION

        • Maintient la fluidité des longues conversations grâce à la
        virtualisation CSS native content-visibility.

        • Inclut une barre de navigation flottante, la copie propre du fil et l
        export Markdown complet.


        CONFIDENTIALITÉ PAR CONCEPTION

        ────────────────────────────────────────

        ✓ Zéro analytique, zéro suivi, zéro serveur externe.

        ✓ Toutes vos préférences et accès dossiers restent strictement sur votre
        appareil.

        ✓ Le bridge est limité exclusivement à 127.0.0.1 avec authentification
        par jeton.
    es:
      title: Vexel — Workspace local Google AI Mode
      summary: "Convierte Google AI Mode en un espacio local: comandos /, archivos @, guardado directo de código y virtualización rápida."
      detailedDescription: >
        Vexel transforma Google AI Mode en un entorno de ingeniería rápido,
        controlado por teclado y conectado directamente a tu repositorio — sin
        servidores intermedios ni telemetría.


        CARACTERÍSTICAS CLAVE

        ────────────────────────────────────────


        1. COMANDOS SLASH Y SKILLS DE INGENIERÍA (/)

        • Escribe "/" en el cuadro de texto de Google AI Mode para activar
        prompts reutilizables y flujos SKILL.md (revisión de código,
        arquitectura, pruebas, refactorización).

        • Navegación instantánea por teclado e instalación en un clic desde
        skills.sh.


        2. CONTEXTO DE REPOSITORIO (@) — MODO SIN SERVIDOR O BRIDGE LOCAL

        • Escribe "@" para explorar los archivos de tu proyecto o empaquetar una
        carpeta completa sin salir de Google AI Mode.

        • Modo Sin Servidor: Utiliza la API nativa File System Access de Chrome
        directamente en tu equipo — sin terminal ni procesos en segundo plano.

        • Bridge opcional (@vexel/bridge): Se conecta por localhost (127.0.0.1)
        para inyectar git diff y sincronizar tu espacio de trabajo.


        3. GUARDADO DIRECTO "SAVE TO FILE" EN BLOQUES DE CÓDIGO

        • Pasa el cursor sobre cualquier bloque de código generado para mostrar
        el botón "Save to file".

        • Detecta automáticamente la ruta de destino desde el lenguaje o los
        comentarios de cabecera, con autocompletado de carpetas.


        4. CONVERSIÓN AUTOMÁTICA DE PEGADOS LARGOS EN ARCHIVOS ADJUNTOS

        • Pegar registros extensos, trazas de pila o fragmentos multiarchivo los
        convierte automáticamente en archivos adjuntos limpios.


        5. VIRTUALIZACIÓN DE ALTA VELOCIDAD Y BARRA DE LÍNEA DE TIEMPO

        • Mantiene fluidas las sesiones largas mediante virtualización CSS
        nativa content-visibility.

        • Incluye barra de navegación flotante, copia limpia del hilo y
        exportación completa en Markdown.


        PRIVACIDAD POR DISEÑO

        ────────────────────────────────────────

        ✓ Cero analíticas, cero rastreo, cero servidores externos.

        ✓ Todas tus preferencias y accesos a carpetas permanecen estrictamente en
        tu dispositivo.

        ✓ El bridge está limitado exclusivamente a 127.0.0.1 con autenticación
        por token.
    de:
      title: Vexel — Lokaler Workspace für Google AI
      summary: "Lokale Befehlspalette (/), Projektdateien (@), direktes Speichern von Codeblöcken und schnelle DOM-Virtualisierung."
      detailedDescription: >
        Vexel verwandelt Google AI Mode in eine schnelle, tastaturgesteuerte
        Entwicklungsumgebung, die direkt mit deinem Repository verbunden ist —
        ohne Cloud-Relays und ohne Telemetrie.


        HAUPTFUNKTIONEN

        ────────────────────────────────────────


        1. SLASH-BEFEHLE & ENGINEERING-SKILLS (/)

        • Tippe "/" in das Eingabefeld von Google AI Mode, um wiederverwendbare
        Prompts und SKILL.md-Workflows auszulösen (Code-Review, Architektur,
        Tests, Refactoring).

        • Sofortige Tastaturnavigation und Ein-Klick-Installation von skills.sh.


        2. REPOSITORY-KONTEXT (@) — SERVERLOS ODER LOKALE BRIDGE

        • Tippe "@", um Projektdateien zu durchsuchen oder ganze Ordner in
        sauberen Kontext zu packen, ohne Google AI Mode zu verlassen.

        • Serverloser Modus: Nutzt die native File System Access API von Chrome
        direkt auf deinem Gerät — kein Terminal erforderlich.

        • Optionale Bridge (@vexel/bridge): Verbindet sich über localhost
        (127.0.0.1) für Git-Diff-Injektion und Workspace-Synchronisation.


        3. DIREKTES "SAVE TO FILE" FÜR CODEBLÖCKE

        • Fahre mit der Maus über einen generierten Codeblock, um den Button
        "Save to file" einzublenden.

        • Erkennt den Zielpfad automatisch anhand der Sprache oder
        Header-Kommentare inklusive Ordner-Autovervollständigung.


        4. AUTOMATISCHE UMWANDLUNG LANGER EINFÜGUNGEN IN ANHÄNGE

        • Große Logs, Stack-Traces oder Multi-File-Snippets werden beim Einfügen
        automatisch in saubere Dateianhänge umgewandelt.


        5. HOCHGESCHWINDIGKEITS-VIRTUALISIERUNG & TIMELINE-LEISTE

        • Hält lange Sitzungen flüssig durch native CSS content-visibility
        Virtualisierung, schwebende Timeline-Leiste und Markdown-Export.


        DATENSCHUTZ DURCH DESIGN

        ────────────────────────────────────────

        ✓ Keine Analysen, kein Tracking, keine externen Server.

        ✓ Alle Einstellungen und Ordnerzugriffe bleiben strikt auf deinem Gerät.

        ✓ Die optionale Bridge ist ausschließlich an 127.0.0.1 mit
        Token-Authentifizierung gebunden.
