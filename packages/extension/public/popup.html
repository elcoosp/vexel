<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vexel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 316px;
        font-family:
          'Google Sans', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        color: #1f1f1f;
        padding: 14px;
        font-size: 12.5px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      .brand img {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        box-shadow: 0 1px 3px rgba(60, 64, 67, 0.15);
      }
      .version {
        font-size: 10.5px;
        font-weight: 600;
        color: #5f6368;
        background: #f1f3f4;
        padding: 2px 7px;
        border-radius: 999px;
      }
      .lang-btn {
        border: 1px solid #dadce0;
        background: #ffffff;
        color: #3c4043;
        font-family: inherit;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 3px 9px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .lang-btn:hover {
        background: #f8f9fa;
        border-color: #c6dafc;
        color: #1a73e8;
      }
      .lang-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2.5px rgba(26, 115, 232, 0.25);
      }
      .status-card {
        background: #f8f9fa;
        border: 1px solid #e8eaed;
        border-radius: 14px;
        padding: 11px 12px;
        margin-bottom: 12px;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1a73e8;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
        flex-shrink: 0;
      }
      .dot.online {
        background: #137333;
        box-shadow: 0 0 0 3px rgba(19, 115, 51, 0.14);
      }
      .status-sub {
        font-size: 11.5px;
        color: #5f6368;
      }
      .cmd-box {
        margin-top: 9px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        border: 1px solid #dadce0;
        border-radius: 10px;
        padding: 5px 8px 5px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #1f1f1f;
      }
      .copy-btn {
        border: none;
        background: #e8f0fe;
        color: #1967d2;
        font-family: inherit;
        font-weight: 600;
        font-size: 10.5px;
        padding: 3px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.14s ease;
      }
      .copy-btn:hover {
        background: #d2e3fc;
      }
      .cta {
        width: 100%;
        height: 36px;
        border: none;
        border-radius: 999px;
        background: #1a73e8;
        color: #ffffff;
        font-family: inherit;
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
        margin-bottom: 12px;
        box-shadow: 0 2px 6px rgba(26, 115, 232, 0.25);
        transition:
          background-color 0.15s ease,
          transform 0.12s ease;
      }
      .cta:hover {
        background: #1557b0;
      }
      .cta:active {
        transform: scale(0.985);
      }
      .cta:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.3);
      }
      .shortcuts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .sc {
        background: #f8f9fa;
        border: 1px solid #eceff1;
        border-radius: 10px;
        padding: 7px 6px;
        text-align: center;
      }
      .kbd {
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
        background: #ffffff;
        border: 1px solid #dadce0;
        border-bottom-width: 1.5px;
        border-radius: 5px;
        padding: 1px 6px;
        margin-bottom: 3px;
      }
      .sc-lbl {
        display: block;
        font-size: 10.5px;
        color: #5f6368;
      }
      .popup-footer {
        margin-top: 11px;
        padding-top: 9px;
        border-top: 1px solid #eceff1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
      }
      .popup-footer a {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #5f6368;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.14s ease;
      }
      .popup-footer a:hover {
        color: #1a73e8;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img src="icons/icon-48.png" alt="Vexel" />
        <span>Vexel</span>
        <span class="version" id="ext-version">v0.2.5</span>
      </div>
      <button type="button" class="lang-btn" id="lang-toggle">EN</button>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="dot" id="bridge-dot"></span>
        <span id="bridge-title">Zero-Server Mode Ready</span>
      </div>
      <div class="status-sub" id="bridge-sub">
        Use @ in Google AI Mode to pick any local folder, or start the optional CLI bridge:
      </div>
      <div class="cmd-box" id="bridge-cmd-row">
        <code>npx @vexel/bridge</code>
        <button type="button" class="copy-btn" id="copy-cmd">Copy</button>
      </div>
    </div>

    <button type="button" class="cta" id="open-aim">Open Google AI Mode</button>

    <div class="shortcuts">
      <div class="sc">
        <span class="kbd">/</span><span class="sc-lbl" id="lbl-skills">Skills</span>
      </div>
      <div class="sc">
        <span class="kbd">@</span><span class="sc-lbl" id="lbl-files">Files</span>
      </div>
      <div class="sc">
        <span class="kbd">Alt+↓</span><span class="sc-lbl" id="lbl-export">Last prompt</span>
      </div>
    </div>

    <div class="popup-footer">
      <a href="#" id="link-rate">Star on GitHub</a>
      <a href="#" id="link-bug">Report a bug</a>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
