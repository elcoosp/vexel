<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vexel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 310px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: #ffffff;
      color: #1f1f1f;
      padding: 14px;
      font-size: 12.5px;
      line-height: 1.4;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }
    .version {
      font-size: 10.5px;
      font-weight: 600;
      color: #5f6368;
      background: #f1f3f4;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .lang-btn {
      border: 1px solid #dadce0;
      background: #ffffff;
      color: #3c4043;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang-btn:hover { background: #f1f3f4; }
    .status-card {
      background: #f8f9fa;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1a73e8;
      flex-shrink: 0;
    }
    .dot.online { background: #1e8e3e; }
    .status-sub {
      font-size: 11.5px;
      color: #5f6368;
    }
    .cmd-box {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 5px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #1f1f1f;
    }
    .copy-btn {
      border: none;
      background: #e8f0fe;
      color: #1a73e8;
      font-weight: 600;
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 6px;
      cursor: pointer;
    }
    .copy-btn:hover { background: #d2e3fc; }
    .cta {
      width: 100%;
      height: 36px;
      border: none;
      border-radius: 999px;
      background: #1a73e8;
      color: #ffffff;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .cta:hover { background: #1557b0; }
    .shortcuts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .sc {
      background: #f8f9fa;
      border: 1px solid #eceff1;
      border-radius: 8px;
      padding: 6px;
      text-align: center;
    }
    .kbd {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 5px;
      padding: 1px 5px;
      margin-bottom: 2px;
    }
    .sc-lbl {
      display: block;
      font-size: 10.5px;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon-48.png" alt="Vexel" />
      <span>Vexel</span>
      <span class="version" id="ext-version">v0.2.2</span>
    </div>
    <button type="button" class="lang-btn" id="lang-toggle">EN</button>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="dot" id="bridge-dot"></span>
      <span id="bridge-title">Zero-Server Mode Ready</span>
    </div>
    <div class="status-sub" id="bridge-sub">Use @ in Google AI Mode to pick any local folder, or start the optional CLI bridge:</div>
    <div class="cmd-box" id="bridge-cmd-row">
      <code>npx @vexel/bridge</code>
      <button type="button" class="copy-btn" id="copy-cmd">Copy</button>
    </div>
  </div>

  <button type="button" class="cta" id="open-aim">Open Google AI Mode</button>

  <div class="shortcuts">
    <div class="sc"><span class="kbd">/</span><span class="sc-lbl" id="lbl-skills">Skills</span></div>
    <div class="sc"><span class="kbd">@</span><span class="sc-lbl" id="lbl-files">Files</span></div>
    <div class="sc"><span class="kbd">⌘⇧E</span><span class="sc-lbl" id="lbl-export">Export .md</span></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
