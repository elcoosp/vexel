name: Vexel CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: mlugg/setup-zig@v2
        with:
          version: latest
      - name: Install latest prebuilt native formatters (taplo, stylua, sleek, shfmt, ruff)
        uses: taiki-e/install-action@v2
        with:
          tool: taplo,stylua,sleek,shfmt,ruff
      - name: Install latest rustfmt, clang-format, rubocop & alejandra
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format ruby-full
          rustup component add rustfmt
          gem install --no-document rubocop
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
          cargo install alejandra --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit && pnpm test:dom
      - run: npx playwright install chromium
      - name: Run full-pyramid Playwright E2E with strict native formatters
        env:
          VEXEL_E2E_STRICT_FORMATTERS: '1'
        run: xvfb-run -a pnpm test:e2e
