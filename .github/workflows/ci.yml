name: Vexel CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: mlugg/setup-zig@v2
        with:
          version: latest
      - name: Install latest native formatters (rustfmt, ruff, shfmt, clang-format, sleek, taplo, stylua, alejandra, rubocop)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format ruby-full
          rustup component add rustfmt
          python3 -m pip install --upgrade --break-system-packages ruff
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          gem install --no-document rubocop
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          SLEEK_URL=$(curl -fsSL https://github.com | grep -oE 'https://[^"]+x86_64-unknown-linux-gnu\.tar\.gz' | head -n1)
          curl -fsSL "$SLEEK_URL" | tar -xz -C "$HOME/.local/bin"
          TAPLO_URL=$(curl -fsSL https://github.com | grep -oE 'https://[^"]+taplo-linux-x86_64\.gz' | head -n1)
          curl -fsSL "$TAPLO_URL" | gunzip > "$HOME/.local/bin/taplo" && chmod +x "$HOME/.local/bin/taplo"
          STYLUA_URL=$(curl -fsSL https://github.com | grep -oE 'https://[^"]+stylua-linux-x86_64\.zip' | head -n1)
          curl -fsSL "$STYLUA_URL" -o /tmp/stylua.zip && unzip -oq /tmp/stylua.zip -d "$HOME/.local/bin" && chmod +x "$HOME/.local/bin/stylua"
          ALEJANDRA_URL=$(curl -fsSL https://github.com | grep -oE 'https://[^"]+alejandra-x86_64-unknown-linux-gnu' | head -n1)
          curl -fsSL "$ALEJANDRA_URL" -o "$HOME/.local/bin/alejandra" && chmod +x "$HOME/.local/bin/alejandra"
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit && pnpm test:dom
      - run: npx playwright install chromium
      - name: Run full-pyramid Playwright E2E with strict native formatters
        env:
          VEXEL_E2E_STRICT_FORMATTERS: '1'
        run: xvfb-run -a pnpm test:e2e
